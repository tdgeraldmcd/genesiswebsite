    <style>
      :root {
        --color-paper: #f5f2ec;
        --color-ink: #0e0e0c;
        --color-paper-dark: #e7e1d6;
        --color-ink-soft: #484640;
        --color-line: #cfc6b7;

        --font-heading: "Cormorant", Georgia, "Times New Roman", serif;
        --font-body: "JetBrains Mono", "Courier New", monospace;

        --content-width: 1080px;
        --space-page: clamp(20px, 4vw, 48px);
        --hero-panel-pad: clamp(28px, 4vw, 58px);
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--color-ink);
        color: var(--color-paper);
        font-family: var(--font-body);
        line-height: 1.6;
      }

      img {
        display: block;
        max-width: 100%;
      }

      a {
        color: inherit;
      }

      .top-nav {
        position: absolute;
        z-index: 3;
        top: 34px;
        right: clamp(22px, 4vw, 56px);
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 20px;
        color: var(--color-paper);
        font-size: clamp(0.84rem, 1.6vw, 1.1rem);
        font-weight: 600;
        line-height: 1.15;
        text-transform: uppercase;
      }

      .top-nav a {
        text-decoration: none;
      }

      main {
        width: 100%;
        margin: 0;
      }

      .split-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        min-height: 100vh;
      }

      .paper-panel,
      .ink-panel {
        position: relative;
        min-height: 100vh;
        padding: var(--hero-panel-pad);
      }

      .paper-panel {
        display: flex;
        flex-direction: column;
        background: var(--color-paper);
        color: var(--color-ink);
      }

      .ink-panel {
        display: grid;
        place-items: center;
        padding: 0;
        overflow: hidden;
        background: var(--color-ink);
        color: var(--color-paper);
      }

      .hero {
        display: flex;
        align-items: flex-start;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        max-width: 620px;
        padding: clamp(56px, 9vw, 112px) 0 clamp(44px, 7vw, 84px);
        transform: translateY(-4vh);
        width: 100%;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--color-ink-soft);
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        font-family: var(--font-heading);
        line-height: 1.08;
      }

      h1 {
        max-width: 18ch;
        font-size: clamp(2.7rem, 5.2vw, 5.1rem);
        font-weight: 500;
        letter-spacing: 0;
      }

      h2 {
        font-size: clamp(1.9rem, 3.9vw, 3.85rem);
        font-weight: 500;
      }

      p {
        margin: 0;
      }

      .lead {
        max-width: 62ch;
        margin-top: 18px;
        color: var(--color-ink-soft);
        font-size: 0.96rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
        width: 100%;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 12px 20px;
        border: 1px solid var(--color-ink);
        border-radius: 0;
        background: transparent;
        color: var(--color-ink);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .button.secondary {
        background: transparent;
        color: var(--color-ink);
      }

      .ouroboros-image {
        width: min(63%, 413px);
        height: auto;
        object-fit: contain;
      }

      .hero-meta {
        position: absolute;
        left: var(--hero-panel-pad);
        bottom: var(--hero-panel-pad);
        color: var(--color-ink);
        font-size: clamp(0.72rem, 1.2vw, 0.84rem);
        font-weight: 600;
        letter-spacing: 0.08em;
        line-height: 1.2;
        text-align: left;
        text-transform: uppercase;
      }

      .service-menu {
        margin-top: clamp(6px, 1.4vw, 12px);
        width: 100%;
      }

      .service-menu h2 {
        max-width: 26ch;
        margin-bottom: 0;
        color: var(--color-ink-soft);
        font-size: clamp(1.69rem, 2.9vw, 2.8rem);
        text-align: left;
      }

      .section {
        padding: clamp(44px, 8vw, 88px) 0;
        border-top: 1px solid var(--color-line);
      }

      .details {
        background: var(--color-paper);
        color: var(--color-ink);
        padding: 0 var(--space-page);
      }

      .ordered-text {
        max-width: 920px;
      }

      .ordered-text p + p {
        margin-top: 18px;
      }

      .about-editorial {
        max-width: 920px;
      }

      .about-editorial h2 {
        margin-bottom: clamp(34px, 6vw, 62px);
      }

      .about-entry + .about-entry {
        margin-top: clamp(32px, 5vw, 52px);
      }

      .about-entry h3 {
        margin-bottom: 14px;
        font-family: var(--font-body);
        font-size: 0.95rem;
        letter-spacing: 0.02em;
      }

      .about-entry p {
        max-width: 78ch;
        color: var(--color-ink-soft);
        font-size: 0.95rem;
      }

      .about-entry p + p {
        margin-top: 18px;
      }

      .client-text {
        color: var(--color-ink-soft);
        font-size: 0.9rem;
      }

      .contact-block {
        display: grid;
        gap: 22px;
        max-width: 680px;
      }

      .contact-block p {
        color: var(--color-ink-soft);
        font-size: 0.9rem;
      }

      .contact-block a {
        color: var(--color-ink);
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      .embed-placeholders {
        display: none;
      }

      .section-header {
        display: grid;
        grid-template-columns: minmax(0, 0.7fr) minmax(280px, 1fr);
        gap: 24px 48px;
        align-items: start;
        margin-bottom: 28px;
      }

      .section-header p {
        color: var(--color-ink-soft);
        font-size: 0.95rem;
      }

      .site-footer {
        width: 100%;
        margin: 0;
        padding: 30px 0 42px;
        border-top: 1px solid var(--color-line);
        background: var(--color-paper);
        color: var(--color-ink-soft);
        font-size: 0.8rem;
      }

      .site-footer p {
        margin: 0;
        padding-left: clamp(28px, 4vw, 58px);
      }

      @media (max-width: 760px) {
        .split-hero {
          grid-template-columns: 1fr;
        }

        .paper-panel,
        .ink-panel {
          min-height: auto;
        }

        .top-nav {
          position: static;
          justify-content: flex-start;
          padding: 26px var(--space-page) 0;
          background: var(--color-paper);
          color: var(--color-ink);
        }

        .hero {
          min-height: auto;
          padding: 36px 0 58px;
          transform: none;
        }

        h1 {
          font-size: clamp(2.8rem, 12vw, 4rem);
        }

        .ink-panel {
          min-height: 42vh;
        }

        .ouroboros-image {
          width: min(66vw, 307px);
          min-height: 0;
        }

        .hero-meta {
          bottom: 24px;
          font-size: 0.72rem;
        }

      }
    </style>
  </head>

            <div class="actions">
