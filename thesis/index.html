<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting | Genesis Content</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://genesiscontent.io/ghl/">
    <script>
      (function () {
        var target = new URL('../ghl/', window.location.href);
        target.search = window.location.search;
        target.hash = window.location.hash;
        window.location.replace(target.toString());
      })();
    </script>
  </head>

  <body>
    <p>
      This page has moved to
      <a href="../ghl/">genesiscontent.io/ghl/</a>.
    </p>
  </body>
</html>
