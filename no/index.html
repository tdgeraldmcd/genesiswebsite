<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wishing You the Best | Genesis Content</title>
    <meta
      name="description"
      content="Genesis Content services are for people ready to invest and get started today or tomorrow."
    >
    <link rel="canonical" href="https://genesiscontent.io/no/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="../assets/page.css">
    <style>
      .no-page .site-shell {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      .no-page main {
        display: grid;
        flex: 1;
        place-items: center;
        padding: clamp(56px, 10vw, 120px) var(--space-page);
      }

      .no-page .no-message {
        width: min(100%, 980px);
        margin: 0;
        color: var(--strategy-ink);
        font-family: "Oswald", "Arial Narrow", sans-serif;
        font-size: clamp(2.35rem, 6vw, 5.5rem);
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.04;
        text-align: center;
        text-transform: uppercase;
        text-wrap: balance;
      }

      .no-page .no-message span {
        color: var(--strategy-green-text);
      }

      .no-page .thesis-contact {
        padding-top: 24px;
      }

      @media (max-width: 560px) {
        .no-page .thesis-header {
          grid-template-columns: 1fr;
          gap: 8px;
          text-align: center;
        }

        .no-page .thesis-header .brand-link,
        .no-page .thesis-phone {
          justify-self: center;
        }
      }
    </style>
  </head>

  <body class="strategy-style-page no-page">
    <div class="site-shell">
      <header class="thesis-header">
        <span class="brand-link">Genesis Content</span>
        <p class="thesis-phone">Phone: (914) 455-0381</p>
      </header>

      <main>
        <h1 class="no-message">
          Sorry! This service is only for people who are willing to invest and start today or tomorrow. <span>Wishing you best of luck!</span>
        </h1>
      </main>

      <section class="thesis-contact" aria-label="Contact information">
        <p>2248 Broadway New York, NY 10024 United States</p>
      </section>

      <footer class="site-footer">
        <p>&copy; 2026. Genesis Content</p>
      </footer>
    </div>
  </body>
</html>
