  <style>
    :root{--ink:#0e0e0c;--cream:#f5f2ec;--panel:#161613;--panel2:#1f1f1b;--line:#2e2e29;--muted:#9b9990;--accent:var(--cream);--radius:4px}*{box-sizing:border-box}html,body{margin:0}body{min-height:100vh;padding:64px 24px 80px;background:var(--ink);color:var(--cream);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}.brand{display:inline-block;margin-bottom:48px;color:var(--cream);font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-decoration:none;text-transform:uppercase}.brand:hover{text-decoration:underline;text-underline-offset:5px}.hero{max-width:1000px;margin:0 auto 48px}.hero h1{max-width:20ch;margin:0 0 18px;font-family:'JetBrains Mono',monospace;font-size:clamp(1.9rem,4.4vw,3.3rem);font-weight:800;letter-spacing:-.045em;line-height:1.06}.hero p{max-width:62ch;margin:0;color:var(--muted);font-size:clamp(1rem,1.5vw,1.15rem);line-height:1.6}.shell{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;max-width:1180px;margin:auto}.card{padding:24px 26px 28px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:6px;padding-bottom:16px;border-bottom:1px solid var(--line)}.card-head h2{margin:0;color:var(--muted);font:500 .78rem 'JetBrains Mono',monospace;letter-spacing:.1em}.reset{padding:0;border:0;background:none;color:var(--cream);font:inherit;font-size:.86rem;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}.reset:hover{ text-decoration-color:var(--cream)}.field{padding:21px 0;border-bottom:1px solid var(--line)}.field:last-child{padding-bottom:4px;border:0}.field-top{display:flex;align-items:center;justify-content:space-between;gap:14px}.field-label{display:flex;align-items:center;gap:9px;font-size:1rem;font-weight:500}.hint{display:grid;place-items:center;width:18px;height:18px;flex:none;padding:0;border:1px solid var(--line);border-radius:2px;background:var(--panel2);color:var(--muted);font:inherit;font-size:.7rem;cursor:pointer}.hint:hover{border-color:var(--cream);color:var(--cream)}.hint-body{display:none;max-width:60ch;margin-top:12px;padding:11px 13px;border-left:2px solid var(--line);background:var(--panel2);color:var(--muted);font-size:.85rem;line-height:1.55}.hint-body.open{display:block}.readout{display:flex;align-items:center;min-width:132px;padding:8px 12px;border:1px solid var(--line);border-radius:2px;background:var(--panel2);font-family:'JetBrains Mono',monospace}.readout:focus-within{border-color:var(--cream)}.readout span{color:var(--muted);font-size:.93rem}.readout .pre{margin-right:6px}.readout .post{margin-left:2px}.readout input{width:100%;min-width:0;border:0;outline:0;background:none;color:var(--cream);font:500 1rem 'JetBrains Mono',monospace;text-align:right}.slider{width:100%;margin:20px 0 8px;appearance:none;background:none}.slider:focus{outline:none}.slider::-webkit-slider-runnable-track{height:3px;background:var(--track,var(--panel2))}.slider::-moz-range-track{height:3px;background:var(--track,var(--panel2))}.slider::-webkit-slider-thumb{width:14px;height:14px;margin-top:-5.5px;border:0;border-radius:2px;background:var(--accent);appearance:none;cursor:grab}.slider::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:2px;background:var(--accent);cursor:grab}.bounds{display:flex;justify-content:space-between;color:var(--muted);font:.78rem 'JetBrains Mono',monospace}.toggle{display:flex;overflow:hidden;border:1px solid var(--line);border-radius:2px}.toggle button{padding:6px 15px;border:0;background:none;color:var(--muted);font:.8rem 'JetBrains Mono',monospace;cursor:pointer}.toggle button[aria-pressed=true]{background:var(--accent);color:var(--ink);font-weight:700}.headline{margin:20px 0 24px;padding:24px 26px;background:var(--accent);color:var(--ink)}.cap{font:500 .76rem 'JetBrains Mono',monospace;letter-spacing:.1em}.headline .cap{opacity:.62}.headline .big{margin:8px 0 5px;font:800 clamp(2.2rem,5vw,3.4rem)/1.04 'JetBrains Mono',monospace;letter-spacing:-.045em}.headline .sub{font-size:.98rem;opacity:.7}.step{display:flex;flex-direction:column;gap:7px;padding:14px 0}.step-top{display:flex;align-items:baseline;gap:12px}.step-name{flex:1;font-size:.98rem}.step-val{font:500 1.28rem 'JetBrains Mono',monospace;letter-spacing:-.02em}.step.final .step-val{font-weight:800}.bar{height:3px;background:var(--panel2)}.bar i{display:block;height:100%;background:var(--accent);opacity:.55;transition:width .3s}.step.final .bar i{opacity:1}.step-note{color:var(--muted);font:.78rem 'JetBrains Mono',monospace}.per-m{margin-top:18px;padding:17px 20px;border-left:2px solid var(--accent);background:var(--panel2)}.per-m .cap{color:var(--muted)}.per-m .v{margin-top:6px;font:700 1.55rem 'JetBrains Mono',monospace;letter-spacing:-.03em}.reset:focus-visible,.toggle button:focus-visible,.hint:focus-visible,.brand:focus-visible{outline:2px solid var(--cream);outline-offset:3px}@media(max-width:900px){body{padding:32px 16px 60px}.brand{margin-bottom:38px}.shell{grid-template-columns:1fr}.card{padding:20px 18px 24px}}@media(max-width:520px){.field-top{align-items:flex-start;flex-direction:column}.readout{width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PPDSXMZH" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <header class="hero"><a class="brand" href="/">Genesis Content</a><h1>See what your organic reach is actually worth.</h1><p>Views are not the product. Revenue is. Set your funnel metrics below for potential ROI forecasting.</p></header>
  <main class="shell">
    <section class="card" aria-labelledby="numbers-title"><div class="card-head"><h2 id="numbers-title">your numbers</h2><button class="reset" id="reset" type="button">Reset to defaults</button></div><div id="fields"></div></section>
    <section class="card" aria-labelledby="return-title"><div class="card-head"><h2 id="return-title">projected return</h2><div class="toggle" role="group" aria-label="Time period"><button type="button" id="btnYear" aria-pressed="true">Yearly</button><button type="button" id="btnMonth" aria-pressed="false">Monthly</button></div></div><div class="headline" aria-live="polite"><div class="cap" id="revCap">revenue per year</div><div class="big" id="revBig">$0</div><div class="sub">= <b id="revSub">$0</b> <span id="revSubUnit">per month</span></div></div><div id="steps"></div><div class="per-m"><div class="cap">revenue per 1M views</div><div class="v" id="per1m">$0</div></div></section>
  </main>
  <script>
    const FIELDS=[
      {key:'views',label:'Organic views',def:1e6,min:1e6,max:5e8,scale:'log',step:1000,fmt:'int',pre:'',post:'',hint:'Total views your content earns in a year across every platform. Slide it up to model what more reach is worth.'},
      {key:'ctr',label:'Views to profile link clicks',def:.21,min:.01,max:2,scale:'linear',step:.01,fmt:'pct2',pre:'',post:'%',hint:'The share of viewers who tap through to your profile link. 0.1–0.3% is typical for short-form video.'},
      {key:'booking',label:'Link clicks to appointments',def:2,min:.25,max:15,scale:'linear',step:.05,fmt:'pct2',pre:'',post:'%',hint:'Of the people who reach your booking page, the share who actually book a slot. A tight landing page lands 2–5%.'},
      {key:'show',label:'Show rate',def:60,min:20,max:100,scale:'linear',step:1,fmt:'int',pre:'',post:'%',hint:'Booked calls that people turn up for. Reminders and a short booking-to-call gap push this above 70%.'},
      {key:'close',label:'Close rate',def:20,min:1,max:100,scale:'linear',step:1,fmt:'int',pre:'',post:'%',hint:'Held calls that turn into paying clients.'},
      {key:'deal',label:'Average deal size',def:2520,min:500,max:250000,scale:'log',step:10,fmt:'int',pre:'$',post:'',hint:'What one closed client pays you. Use first-contract value, not lifetime value, to keep the forecast conservative.'}
    ];
    const state=Object.fromEntries(FIELDS.map(f=>[f.key,f.def])),T=1000,nf=n=>n.toLocaleString('en-US'),money=n=>'$'+Math.round(n).toLocaleString('en-US'),pct2=n=>n.toFixed(2),fmt=(f,v)=>f.fmt==='pct2'?pct2(v):nf(Math.round(v));let period='year';
    const clamp=(f,v)=>!isFinite(v)?f.def:Math.min(f.max,Math.max(f.min,v));
    const toSlider=(f,v)=>Math.round(f.scale==='log'?T*Math.log(v/f.min)/Math.log(f.max/f.min):T*(v-f.min)/(f.max-f.min));
    const fromSlider=(f,t)=>clamp(f,+((Math.round((f.scale==='log'?f.min*Math.pow(f.max/f.min,t/T):f.min+(f.max-f.min)*(t/T))/f.step)*f.step).toFixed(4)));
    const fields=document.getElementById('fields');
    const paint=s=>{const p=s.value/T*100;s.style.setProperty('--track',`linear-gradient(90deg,var(--accent) 0 ${p}%,var(--panel2) ${p}% 100%)`)};
    FIELDS.forEach(f=>{const w=document.createElement('div');w.className='field';w.innerHTML=`<div class="field-top"><div class="field-label"><label for="in-${f.key}">${f.label}</label><button class="hint" type="button" aria-expanded="false" aria-controls="hint-${f.key}" aria-label="About ${f.label}">?</button></div><div class="readout">${f.pre?`<span class="pre">${f.pre}</span>`:''}<input id="in-${f.key}" type="text" inputmode="decimal" autocomplete="off">${f.post?`<span class="post">${f.post}</span>`:''}</div></div><div class="hint-body" id="hint-${f.key}">${f.hint}</div><input class="slider" type="range" min="0" max="${T}" step="1" aria-label="${f.label}"><div class="bounds"><span>${f.pre}${fmt(f,f.min)}${f.post}</span><span>${f.pre}${fmt(f,f.max)}${f.post}</span></div>`;fields.appendChild(w);const box=w.querySelector('input[type=text]'),slider=w.querySelector('input[type=range]'),hint=w.querySelector('.hint'),body=w.querySelector('.hint-body');slider.addEventListener('input',()=>{state[f.key]=fromSlider(f,+slider.value);box.value=fmt(f,state[f.key]);paint(slider);render()});box.addEventListener('input',()=>{const raw=parseFloat(box.value.replace(/[^0-9.]/g,''));if(isNaN(raw))return;state[f.key]=clamp(f,raw);slider.value=toSlider(f,state[f.key]);paint(slider);render()});box.addEventListener('blur',()=>box.value=fmt(f,state[f.key]));hint.addEventListener('click',()=>{const open=body.classList.toggle('open');hint.setAttribute('aria-expanded',open)});f.box=box;f.slider=slider});
    const sync=()=>FIELDS.forEach(f=>{f.box.value=fmt(f,state[f.key]);f.slider.value=toSlider(f,state[f.key]);paint(f.slider)});
    const STEPS=[['views','Organic views'],['clicks','Profile link clicks'],['appts','Appointments booked'],['calls','Calls held'],['clients','Clients closed',true]],steps=document.getElementById('steps');STEPS.forEach(([key,name,final])=>{const r=document.createElement('div');r.className='step'+(final?' final':'');r.innerHTML=`<div class="step-top"><span class="step-name">${name}</span><span class="step-val" id="v-${key}">0</span></div><div class="bar"><i id="b-${key}" style="width:0%"></i></div><div class="step-note" id="n-${key}"></div>`;steps.appendChild(r)});
    const compute=()=>{const div=period==='month'?12:1,views=state.views/div,clicks=views*state.ctr/100,appts=clicks*state.booking/100,calls=appts*state.show/100,clients=calls*state.close/100;return{views,clicks,appts,calls,clients,revenue:clients*state.deal}};
    const barPct=(v,top)=>top<=10||v<=1?v<=1?2:100:Math.max(2,Math.min(100,Math.log10(Math.max(v,1.0001))/Math.log10(top)*100));
    function render(){const r=compute(),unit=period==='month'?'month':'year',other=period==='month'?'year':'month',vals={views:r.views,clicks:r.clicks,appts:r.appts,calls:r.calls,clients:r.clients};revCap.textContent=`revenue per ${unit}`;revBig.textContent=money(r.revenue);revSub.textContent=money(period==='month'?r.revenue*12:r.revenue/12);revSubUnit.textContent=`per ${other}`;const set=(k,v,n)=>{document.getElementById('v-'+k).textContent=v;document.getElementById('b-'+k).style.width=barPct(vals[k],r.views)+'%';document.getElementById('n-'+k).textContent=n};set('views',nf(Math.round(r.views)),`per ${unit}`);set('clicks',nf(Math.round(r.clicks)),`${pct2(state.ctr)}% of views`);set('appts',nf(Math.round(r.appts)),`${pct2(state.booking)}% of clicks`);set('calls',nf(Math.round(r.calls)),`${state.show}% of appointments`);set('clients',r.clients.toFixed(1),`${state.close}% of calls held`);per1m.textContent=money(r.views?r.revenue/(r.views/1e6):0)}
    reset.addEventListener('click',()=>{FIELDS.forEach(f=>state[f.key]=f.def);sync();render()});function setPeriod(p){period=p;btnYear.setAttribute('aria-pressed',p==='year');btnMonth.setAttribute('aria-pressed',p==='month');render()}btnYear.addEventListener('click',()=>setPeriod('year'));btnMonth.addEventListener('click',()=>setPeriod('month'));sync();render();
  </script>
</body>
